<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LSL Count">
<meta name="theme-color" content="#17181A">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<title>LSL Container Count</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{
  /* System faces — identical rendering online and offline. On iPhone these
     resolve to SF Pro and SF Mono. */
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
  --bg: #17181A;
  --surface: #212327;
  --surface-2: #292B30;
  --line: #34363C;
  --ink: #ECEBE6;
  --ink-dim: #9C9EA5;
  --amber: #F2B33D;
  --amber-ink: #1A1608;
  --green: #6FBF8B;
  --red: #E2685F;
  --radius: 10px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0;padding:0; overscroll-behavior-y:contain;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-tap-highlight-color: transparent;
  touch-action:manipulation;
  min-height:100vh;
  min-height:100dvh;
}
.mono{font-family:var(--mono);}
/* iOS zooms the page in when a focused input's font-size is under 16px — every
   text input in this app is pinned to 16px so tapping into a field never triggers it */
input, select, textarea{ font-size:16px; }

.wordmark{
  height:26px; width:auto; flex-shrink:0; margin-right:2px; overflow:visible;
}
.brand-row h1{
  border-left:1px solid var(--line); padding-left:10px; margin-left:8px;
}

/* install / update bar */
.update-bar{
  display:none; align-items:center; justify-content:space-between; gap:10px;
  background:var(--surface-2); border:1px solid var(--amber); border-radius:9px;
  padding:9px 10px 9px 12px; margin-top:10px; font-size:12.5px; color:var(--ink);
}
.update-bar.show{display:flex;}
.update-bar button{
  flex-shrink:0; background:var(--amber); color:var(--amber-ink); border:none;
  border-radius:7px; padding:7px 12px; font-size:12px; font-weight:700;
  font-family:var(--sans); cursor:pointer;
}
.update-bar .dismiss{
  background:none; color:var(--ink-dim); font-weight:500; padding:7px 4px;
}

/* header */
header{
  position:sticky; top:0; z-index:20;
  background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 12px;
}
.brand-row{
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  margin-bottom:10px;
}
.brand-row h1{
  font-size:15px; letter-spacing:.06em; text-transform:uppercase;
  font-weight:600; margin:0; color:var(--ink);
}
.brand-row .tick{
  font-family:var(--mono); font-size:12px; color:var(--amber);
}
.view-tabs{
  display:flex; gap:6px; margin-top:10px;
}
.view-tab{
  flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
  background:var(--surface); border:1px solid var(--line); color:var(--ink-dim);
  border-radius:9px; padding:9px 10px; font-size:13px; font-weight:600;
  font-family:var(--sans); cursor:pointer;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.view-tab.active{
  background:var(--surface-2); border-color:var(--amber); color:var(--ink);
}
.tab-badge{
  background:var(--amber); color:var(--amber-ink); font-weight:700;
  font-family:var(--mono); font-size:11.5px;
  border-radius:20px; padding:1px 7px; min-width:18px; text-align:center;
}
.view-tab:not(.active) .tab-badge{background:var(--line); color:var(--ink-dim);}
.save-indicator{
  font-size:10px; color:var(--green); text-align:center; margin-top:8px;
  opacity:0; transition:opacity .3s; font-family:var(--mono);
  letter-spacing:.03em;
}
.save-indicator.show{opacity:1;}
.backup-row{
  display:flex; align-items:center; justify-content:center; gap:8px;
  margin-top:8px; font-size:11px;
}
.backup-link{
  background:none; border:none; color:var(--ink-dim); font-size:11px;
  font-family:var(--mono); cursor:pointer; padding:2px 4px;
}
.backup-link:active{color:var(--amber);}
.backup-sep{color:var(--line);}
/* Two up, then Counted by across the full width. Three columns on a 375px phone left
   the initials box about 90px wide, which isn't enough to see what you typed. */
.session-grid{
  display:grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); gap:8px;
}
.session-grid .field-full{grid-column:1 / -1;}
@media (min-width:560px){
  .session-grid{grid-template-columns: minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.2fr);}
  .session-grid .field-full{grid-column:auto;}
}
/* container numbers are short, so this stays narrow and the row holds one line */
.cont-ctrl{flex-shrink:0;}
.cont-ctrl input{
  width:76px; box-sizing:border-box; background:var(--surface-2);
  border:1px solid var(--line); color:var(--ink); border-radius:7px;
  padding:8px 6px; font-size:16px; font-family:var(--mono);
  text-transform:uppercase; text-align:center;
}
.cont-ctrl input::placeholder{color:var(--ink-dim); text-transform:none;}
.cont-ctrl input:focus{outline:none; border-color:var(--amber);}

/* One grid definition drives both the label strip and every row's field line, so the
   columns actually line up instead of merely looking similar. */
.log-grid{
  display:grid;
  grid-template-columns: 1.05fr 1.05fr 1.1fr 0.8fr 1fr;
  gap:5px;
}
.log-col-strip{
  composes:log-grid;
  display:grid; grid-template-columns: 1.05fr 1.05fr 1.1fr 0.8fr 1fr; gap:5px;
  margin-top:8px; padding:0 2px;
}
.log-col-strip span{
  font-size:9px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--ink-dim); font-weight:600; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis;
}
.log-fields{
  display:grid; grid-template-columns: 1.05fr 1.05fr 1.1fr 0.8fr 1fr; gap:5px;
  width:100%; margin-top:7px;
}
.log-fields input{
  width:100%; box-sizing:border-box; min-width:0;
  background:var(--surface-2); border:1px solid var(--line); color:var(--ink);
  border-radius:7px; padding:8px 4px; font-size:15px; font-family:var(--mono);
  text-align:center;
}
.log-fields input::placeholder{color:var(--ink-dim); font-size:12px;}
.log-fields input:focus{outline:none; border-color:var(--amber);}
.log-fields input.filled{border-color:rgba(242,179,61,.4);}
.field label{
  display:block; font-size:10px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--ink-dim); margin-bottom:4px; font-weight:600;
}
.field input{
  width:100%; background:var(--surface); border:1px solid var(--line);
  color:var(--ink); border-radius:8px; padding:11px 10px; font-size:16px;
  font-family:var(--mono);
}
.field input:focus{outline:none; border-color:var(--amber);}

/* search */
.search-wrap{
  position:sticky; top:var(--header-h, 150px); z-index:19;
  background:var(--bg); padding:12px 14px 10px; border-bottom:1px solid var(--line);
}
.search-box{position:relative;}
.search-box input{
  width:100%; padding:14px 44px 14px 14px; font-size:16px;
  background:var(--surface); border:1.5px solid var(--line); border-radius:12px;
  color:var(--ink); font-family:var(--mono);
}
.search-box input:focus{outline:none; border-color:var(--amber);}
.search-box .clear{
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--ink-dim); font-size:20px; padding:4px 8px;
  cursor:pointer; display:none;
}
.search-hint{font-size:11px; color:var(--ink-dim); margin-top:6px; padding-left:2px;}

/* results */
main{padding:8px 14px calc(20px + env(safe-area-inset-bottom));}
.results{display:flex; flex-direction:column; gap:6px;}
.empty-state{
  text-align:center; color:var(--ink-dim); padding:40px 20px; font-size:13px; line-height:1.6;
}
.empty-state .big{font-size:28px; display:block; margin-bottom:10px;}

.result-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; cursor:pointer; transition:background .12s, border-color .12s, transform .06s;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.result-row:active{transform:scale(0.98); background:var(--surface-2); border-color:var(--amber);}
.result-main{min-width:0;}
.result-title{font-size:14.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.result-sub{font-size:12px; color:var(--ink-dim); margin-top:2px; font-family:var(--mono);}
.result-cat{
  flex-shrink:0; font-size:9.5px; text-transform:uppercase; letter-spacing:.06em;
  color:var(--amber); border:1px solid rgba(242,179,61,0.4); border-radius:5px;
  padding:3px 6px; font-weight:600; white-space:nowrap;
}

mark{background:rgba(242,179,61,0.32); color:inherit; border-radius:2px;}

#libraryView{ display:none; }
.add-item-btn{ margin-bottom:10px; }
.lib-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; cursor:pointer; transition:background .12s, border-color .12s, transform .06s;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.lib-row:active{transform:scale(0.98); background:var(--surface-2); border-color:var(--amber);}
.lib-row .result-main{min-width:0; flex:1;}
.lib-badges{display:flex; gap:5px; flex-shrink:0; align-items:center;}
.lib-flag{
  font-size:9px; text-transform:uppercase; letter-spacing:.05em; font-weight:700;
  border-radius:5px; padding:3px 6px; white-space:nowrap;
}
.lib-flag.custom{color:var(--green); border:1px solid rgba(111,191,139,0.4);}
.lib-flag.edited{color:var(--amber); border:1px solid rgba(242,179,61,0.4);}
.lib-pencil{color:var(--ink-dim); font-size:14px;}

/* custom add */
.custom-add-btn{
  width:100%; margin-top:4px; padding:12px; border-radius:var(--radius);
  background:transparent; border:1px dashed var(--line); color:var(--ink-dim);
  font-size:13px; cursor:pointer; font-family:var(--sans);
}
.custom-add-btn:active{border-color:var(--amber); color:var(--amber);}

/* bottom sheet (log) */
/* log screen */
#logView{ display:none; }
.log-screen-header{
  position:sticky; top:var(--header-h, 150px); z-index:19; background:var(--bg);
  padding:14px 14px 12px; border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; justify-content:space-between;
}
.log-stats{font-size:13px; color:var(--ink-dim);}
.log-stats b{color:var(--ink); font-family:var(--mono); font-weight:700;}
.log-screen-body{padding:8px 14px 4px;}

.log-entry{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 0; border-bottom:1px solid var(--line);
}
.log-entry .info{flex:1 1 140px; min-width:0;}
.log-entry .title{font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.log-entry .sub{font-size:11.5px; color:var(--ink-dim); font-family:var(--mono); margin-top:2px;}
.log-controls{
  display:flex; align-items:center; gap:8px; flex-wrap:nowrap;
  margin-left:auto;
}
@media (max-width:400px){
  .log-controls{ flex:1 1 100%; margin-left:0; justify-content:space-between; }
}
.dot-ctrl{flex-shrink:0;}
.dot-ctrl input{
  width:100px; background:var(--surface-2); border:1px solid var(--line);
  color:var(--ink); border-radius:7px; padding:8px 8px; font-size:16px;
  font-family:var(--mono); text-transform:uppercase;
}
.dot-ctrl input::placeholder{color:var(--ink-dim); text-transform:none;}
.dot-ctrl input:focus{outline:none; border-color:var(--amber);}
.qty-ctrl{display:flex; align-items:center; gap:4px; flex-shrink:0;}
.qty-ctrl button{
  width:34px; height:34px; border-radius:8px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink); font-size:17px; line-height:1;
  cursor:pointer;
}
.qty-ctrl button:active{border-color:var(--amber); color:var(--amber);}
.qty-ctrl .qty{
  width:42px; text-align:center; font-family:var(--mono); font-size:16px; font-weight:600;
  background:var(--surface-2); border:1px solid var(--line); border-radius:7px;
  color:var(--ink); padding:7px 2px;
}
.qty-ctrl .qty:focus{outline:none; border-color:var(--amber);}
.del-btn{
  flex-shrink:0; background:none; border:none; color:var(--red); font-size:19px;
  padding:8px 6px; cursor:pointer; min-width:34px; min-height:34px;
}
.row-act{
  flex-shrink:0; align-self:center; background:var(--surface-2);
  border:1px solid var(--line); border-radius:7px; color:var(--ink-dim);
  font-size:11px; font-weight:600; font-family:var(--sans);
  padding:7px 8px; margin-left:6px; cursor:pointer; white-space:nowrap;
}
.row-act:active{border-color:var(--amber); color:var(--amber);}
.dot-act{color:var(--amber); border-color:rgba(242,179,61,.35);}
.add-row-btn{
  flex-shrink:0; background:var(--surface-2); border:1px solid var(--amber);
  color:var(--amber); border-radius:8px; font-size:19px; font-weight:600;
  font-family:var(--sans); width:34px; height:34px; line-height:1;
  padding:0; cursor:pointer;
}
.add-row-btn:active{background:var(--amber); color:var(--amber-ink);}
.hint-line{
  font-size:11.5px; color:var(--ink-dim); margin:-4px 0 12px; line-height:1.4;
  font-family:var(--mono);
}
.hint-line.warn{color:var(--amber);}
.spec-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
.spec-row .field input{padding:10px 8px;}
.note-btn{
  flex-shrink:0; background:none; border:1px solid var(--line); border-radius:8px;
  color:var(--ink-dim); font-size:15px; line-height:1; cursor:pointer;
  min-width:34px; height:34px; padding:0 7px;
}
/* filled comments stay visibly marked — a note you can't see is a note you forget to read */
.note-btn.has-note{border-color:var(--amber); color:var(--amber);}
.comment-wrap{flex:1 1 100%; display:none; padding-top:2px;}
.log-entry.show-comment .comment-wrap{display:block;}
.comment-wrap textarea{
  width:100%; box-sizing:border-box; resize:vertical; min-height:52px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
  color:var(--ink); padding:9px 10px; font-size:16px; line-height:1.35;
  font-family:var(--sans);
}
.comment-wrap textarea::placeholder{color:var(--ink-dim);}
.comment-wrap textarea:focus{outline:none; border-color:var(--amber);}
.log-footer{
  display:flex; gap:8px; padding:16px 14px calc(24px + env(safe-area-inset-bottom));
}
.log-footer button{
  flex:1; padding:12px; border-radius:9px; border:none; font-size:13px; font-weight:600;
  cursor:pointer; font-family:var(--sans);
}
.btn-export{background:var(--amber); color:var(--amber-ink);}
.btn-csv{
  background:var(--surface-2); color:var(--ink-dim); border:1px solid var(--line);
  flex:0 0 auto; padding-left:16px; padding-right:16px;
}
.btn-clear{background:var(--surface-2); color:var(--red); border:1px solid var(--line) !important;}
.log-empty{padding:60px 14px; text-align:center; color:var(--ink-dim); font-size:13px; line-height:1.6;}
.log-empty .big{font-size:28px; display:block; margin-bottom:10px;}

/* modal for custom entry */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:40;
  display:none; align-items:flex-end; justify-content:center;
}
.modal-backdrop.show{display:flex;}
.modal{
  background:var(--surface); border-radius:16px 16px 0 0; width:100%; max-width:480px;
  padding:18px 16px 22px; border-top:1px solid var(--line);
}
.modal h2{margin:0 0 14px; font-size:15px; text-transform:uppercase; letter-spacing:.05em;}
.modal .field{margin-bottom:10px;}
.modal-actions{display:flex; gap:8px; margin-top:14px;}
.modal-actions button{
  flex:1; padding:12px; border-radius:9px; border:none; font-weight:600; font-size:13px; cursor:pointer;
}
.btn-primary{background:var(--amber); color:var(--amber-ink);}
.btn-secondary{background:var(--surface-2); color:var(--ink-dim); border:1px solid var(--line) !important;}

/* toast (chalk tick) */
.toast{
  position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-20px);
  background:var(--amber); color:var(--amber-ink); font-family:var(--mono);
  font-weight:700; font-size:13px; padding:9px 16px; border-radius:8px; z-index:50;
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
  white-space:nowrap;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media (min-width:640px){
  .session-grid{max-width:640px; margin:0 auto;}
  .search-wrap, main, header, .log-screen-header, .log-screen-body, .log-footer{max-width:640px; margin:0 auto;}
}
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <svg class="wordmark" viewBox="0 0 300 118" role="img" aria-label="Yale">
      <title>Yale</title>
      <g transform="translate(12,6) scale(0.92) skewX(-12)" fill="#F2B33D"><path d="M2 0 L22 0 L35 28 L48 0 L68 0 L43 50 L43 82 L27 90 L27 50 Z"/><path fill-rule="evenodd" d="M98 0 L118 0 L144 90 L124 90 L119 71 L97 71 L92 90 L72 90 Z M103 58 L115 58 L109 30 Z"/><path d="M152 0 L172 0 L172 72 L210 72 L210 90 L152 90 Z"/><path d="M218 0 L278 0 L278 17 L238 17 L238 36 L270 36 L270 53 L238 53 L238 73 L278 73 L278 90 L218 90 Z"/></g>
      <polygon points="8,100 286,100 276,114 -2,114" fill="#F2B33D"/>
    </svg>
    <h1>Container count</h1>
    <span class="tick" id="netTick"></span>
  </div>
  <div class="session-grid">
    <div class="field">
      <label for="containerInput">Container #</label>
      <input id="containerInput" type="text" placeholder="e.g. MSCU4471" autocomplete="off">
    </div>
    <div class="field">
      <label for="dateInput">Date</label>
      <input id="dateInput" type="date">
    </div>
    <div class="field field-full">
      <label for="counterInput">Counted by</label>
      <input id="counterInput" type="text" placeholder="Initials" autocomplete="off">
    </div>
  </div>
  <div class="view-tabs">
    <button class="view-tab active" id="tabCount" data-view="count">Count</button>
    <button class="view-tab" id="tabLog" data-view="log">Log <span class="tab-badge" id="tabBadge">0</span></button>
    <button class="view-tab" id="tabLibrary" data-view="library">Library</button>
  </div>
  <div class="update-bar" id="updateBar">
    <span id="updateMsg">A newer version is ready.</span>
    <span style="display:flex;gap:2px;">
      <button class="dismiss" id="updateLater">Later</button>
      <button id="updateNow">Update</button>
    </span>
  </div>
  <div class="save-indicator" id="saveIndicator">Saved on this device</div>
  <div class="backup-row">
    <button class="backup-link" id="backupBtn">↓ Backup file</button>
    <span class="backup-sep">·</span>
    <button class="backup-link" id="restoreBtn">↑ Restore</button>
    <input type="file" id="restoreFile" accept="application/json" style="display:none;">
  </div>
</header>

<div id="countView">
  <div class="search-wrap">
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Type brand, model, or size…" autocomplete="off" autocorrect="off" autocapitalize="off">
      <button class="clear" id="clearBtn" aria-label="Clear search">&times;</button>
    </div>
    <div class="search-hint" id="searchHint">library entries — start typing to search</div>
  </div>

  <main>
    <div class="results" id="results"></div>
    <button class="custom-add-btn" id="customAddBtn">+ Not in library — add manually</button>
  </main>
</div>

<div id="logView">
  <div class="log-screen-header">
    <div class="log-stats"><b id="logTotalQty">0</b> tires logged &nbsp;·&nbsp; <span id="logLineCount">0</span> line items</div>
    <div class="log-col-strip" id="logColStrip">
      <span>Cont #</span><span>DOT</span><span>Load/Speed</span><span>Ply/LR</span><span>Type</span>
    </div>
  </div>
  <div class="log-screen-body" id="logEntries"></div>
  <div class="log-footer">
    <button class="btn-clear" id="clearLogBtn">Clear log</button>
    <button class="btn-csv" id="exportCsvBtn">CSV</button>
    <button class="btn-export" id="exportBtn">Export Excel</button>
  </div>
</div>

<div id="libraryView">
  <div class="search-wrap">
    <div class="search-box">
      <input id="libSearchInput" type="text" placeholder="Search the library to edit or delete…" autocomplete="off" autocorrect="off" autocapitalize="off">

let libOverrides = { edits: {}, deletes: [], additions: [] }; // edits keyed by base LIBRARY index (string)

function loadLibOverrides(){
  let raw;
  try{ raw = localStorage.getItem(LIB_OVERRIDES_KEY); }catch(err){ return; }
  if(!raw) return;
  try{
    const data = JSON.parse(raw);
    if(data && typeof data === 'object'){
      libOverrides = { edits: data.edits || {}, deletes: data.deletes || [], additions: data.additions || [] };
      libAddSeq = data.libAddSeq || ((libOverrides.additions.reduce((m,a)=>Math.max(m,a._id||0),0)) + 1);
    }
  }catch(err){ /* corrupted, start fresh */ }
}

function saveLibOverrides(){
  try{
    localStorage.setItem(LIB_OVERRIDES_KEY, JSON.stringify({ ...libOverrides, libAddSeq }));
  }catch(err){ /* storage unavailable, edits still work this session */ }
}

function buildEffectiveLibrary(){
  const eff = [];
  LIBRARY.forEach((item, i) => {
    if(libOverrides.deletes.includes(i)) return;
    const patch = libOverrides.edits[i];
    eff.push({ ...item, ...(patch||{}), _base: i, _custom: false, _edited: !!patch });
  });
  libOverrides.additions.forEach(a => {
    eff.push({ b:a.b, m:a.m, s:a.s, c:a.c, n:a.n, d:'', _base: null, _custom: true, _edited: false, _id: a._id });
  });
  eff.forEach((it, idx) => it._idx = idx);
  EFFECTIVE_LIBRARY = eff;
}

function knownCategories(){
  const set = new Set(LIBRARY.map(i=>i.c));

// ---------- search ----------
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function highlight(text, q){
  if(!q) return text;
  const toks = tokenize(q).filter(t => t.length > 0).sort((a,b)=> b.length-a.length);
  if(!toks.length) return text;
  const re = new RegExp('(' + toks.map(escRe).join('|') + ')', 'ig');
  return text.replace(re, '<mark>$1</mark>');
}

// Strip everything but letters and digits. Sizes get written a dozen ways —
// 195/60R16, 195 60 16, 19560r16 — and nobody types the slash on a phone with gloves on.
function squash(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }

function tokenize(q){
  // split on separators too, so 195-60-16 and 195/60R16 behave like 195 60 16
  return q.toLowerCase().split(/[\s,\/\-]+/).filter(Boolean);
}

// Score one token against one item. Lower is better; null means no match at all.
function scoreToken(item, tok, cache){
  const t = tok.toLowerCase();
  const ts = squash(t);
  if(!ts) return null;

  if(cache.b.startsWith(t) || cache.m.startsWith(t) || cache.s.startsWith(t)) return 0;
  if(cache.hay.includes(' ' + t)) return 1;          // starts a word
  if(cache.hay.includes(t)) return 2;                // anywhere, as typed
  if(cache.bs.startsWith(ts) || cache.ms.startsWith(ts) || cache.ss.startsWith(ts)) return 2;
  if(cache.hays.includes(ts)) return 3;              // matches once punctuation is ignored
  return null;
}

function itemCache(item){
  const b = item.b.toLowerCase(), m = item.m.toLowerCase(), s = item.s.toLowerCase();
  return {
    b, m, s,
    bs: squash(b), ms: squash(m), ss: squash(s),
    hay: (item.b+' '+item.m+' '+item.s).toLowerCase(),
    hays: squash(item.b+item.m+item.s)
  };
}

// Every token has to land somewhere — but each is matched independently, so
// "winda wh 195 16" finds the tire without the words being adjacent or complete.
function scoreItem(item, q, tokens){
  const toks = tokens || tokenize(q);
  if(!toks.length) return -1;
  const cache = itemCache(item);
  let total = 0;
  for(const t of toks){
    const sc = scoreToken(item, t, cache);
    if(sc === null) return -1;
    total += sc;
  }
  return total / toks.length;
}

// Fallback when nothing matches everything: rank by how many tokens did match, so a
// near-miss still surfaces something to look at instead of an empty screen.
function scoreLoose(item, tokens){
  const cache = itemCache(item);
  let hits = 0, total = 0;
  for(const t of tokens){
    const sc = scoreToken(item, t, cache);
    if(sc !== null){ hits++; total += sc; }
  }
  if(!hits) return null;
  return { hits, score: total / hits };
}

function runSearch(){
  const q = searchInput.value.trim().toLowerCase();
  clearBtn.style.display = q ? 'block' : 'none';

  if(!q){
    resultsEl.innerHTML = '';
    searchHint.textContent = EFFECTIVE_LIBRARY.length.toLocaleString() + ' library entries — start typing to search';
    return;
  }

  const tokens = tokenize(q);
  let scored = [];
  for(const item of EFFECTIVE_LIBRARY){
    const sc = scoreItem(item, q, tokens);
    if(sc >= 0) scored.push([sc, item]);
  }
  scored.sort((a,b)=> a[0]-b[0]);

  let loose = false;
  if(scored.length === 0 && tokens.length > 1){
    // nothing matched every word — fall back to whatever matched the most of them
    const partial = [];
    for(const item of EFFECTIVE_LIBRARY){
      const r = scoreLoose(item, tokens);
      if(r) partial.push([r, item]);
    }
    partial.sort((a,b)=> (b[0].hits - a[0].hits) || (a[0].score - b[0].score));
    scored = partial.map(([r,item]) => [r.score, item]);
    loose = scored.length > 0;
  }

  const top = scored.slice(0, 40);

  if(top.length === 0){
    resultsEl.innerHTML = `<div class="empty-state"><span class="big">—</span>No matches for "${escapeHtml(q)}".<br>Try the model number or size — or add it to the library below.</div>`;
    searchHint.textContent = '0 matches';
    return;
  }

  searchHint.textContent = loose
    ? 'No exact match — ' + scored.length + ' close' + (scored.length>40 ? ', showing top 40' : '')
    : scored.length + ' match' + (scored.length===1?'':'es') + (scored.length>40 ? ' — showing top 40' : '');

  resultsEl.innerHTML = top.map(([sc,item]) => {
    const title = highlight(item.b + (item.m && item.m !== '-' ? ' ' + item.m : ''), q);
    const sub = highlight(item.s, q) + (item.n && item.n !== '-' ? ' · ' + item.n : '');
    return `<div class="result-row" data-idx="${item._idx}">
      <div class="result-main">
        <div class="result-title">${title}</div>
        <div class="result-sub">${sub}</div>
      </div>
      <div class="result-cat">${item.c.replace(' Tire','').replace(' Rim',' Rim')}</div>
      <button class="row-act dot-act" data-act="adddot" data-idx="${item._idx}" title="Log as its own line with a DOT">+DOT</button>
      <button class="row-act sim-act" data-act="similar" data-idx="${item._idx}" title="Add a similar tire to the library">+&#8202;similar</button>
    </div>`;
  }).join('');
}

resultsEl.addEventListener('click', (e)=>{
  const act = e.target.closest('button[data-act]');
  const row = e.target.closest('.result-row');
  if(!row && !act) return;
  const idx = parseInt((act || row).dataset.idx, 10);

  if(!item) return;

  const entry = {
    brand: item.b, model: item.m === '-' ? '' : item.m, size: item.s,
    cat: item.c, notes: item.n === '-' ? '' : item.n,
    loadSpeed: item.l || '', ply: item.p || '', type: item.t || ''
  };

  if(act && act.dataset.act === 'similar'){
    // same brand and model, different size — prefill everything and land on Size
    openLibModal(item, { similar:true });
    return;
  }
  if(act && act.dataset.act === 'adddot'){
    // its own line, never rolled up, DOT box open and focused
    const id = addToLog(entry, { forceNew:true });
    switchView('log');
    focusDot(id);
    return;
  }
  addToLog(entry);
});

// ---------- library tab: browse / edit / add / delete catalog items ----------
function libRunSearch(){
  const q = libSearchInput.value.trim().toLowerCase();
  libClearBtn.style.display = q ? 'block' : 'none';

  const libTokens = tokenize(q);
  const pool = q ? EFFECTIVE_LIBRARY.filter(item => scoreItem(item, q, libTokens) >= 0) : EFFECTIVE_LIBRARY;
  const list = q ? pool.slice().sort((a,b)=> scoreItem(a,q,libTokens)-scoreItem(b,q,libTokens)) : pool;
  const top = list.slice(0, 60);

  libSearchHint.textContent = q
    ? (list.length + ' match' + (list.length===1?'':'es') + (list.length>60 ? ' — showing top 60' : ''))
    : (EFFECTIVE_LIBRARY.length.toLocaleString() + ' items — showing first 60, search to narrow');

  if(top.length === 0){
    libResults.innerHTML = `<div class="empty-state"><span class="big">—</span>No matches for "${q}".<br>Use "Add new library item" above to create it.</div>`;
    return;
  }

  libResults.innerHTML = top.map(item => {
    const title = highlight(item.b + (item.m && item.m !== '-' ? ' ' + item.m : ''), q);
    const sub = highlight(item.s, q) + (item.n && item.n !== '-' ? ' · ' + item.n : '');
    const badges = (item._custom ? '<span class="lib-flag custom">Custom</span>' : '') +
                   (item._edited ? '<span class="lib-flag edited">Edited</span>' : '');
    return `<div class="lib-row" data-idx="${item._idx}">
      <div class="result-main">
        <div class="result-title">${title}</div>
        <div class="result-sub">${sub}</div>
      </div>
      <div class="lib-badges">${badges}<span class="lib-pencil">✎</span></div>
    </div>`;
  }).join('');
}

// ---------- autocomplete ----------
// Suggestions narrow as you go: models are filtered to the brand you typed, sizes to the
// brand and model. That's what makes "same tire, different size" a three-tap job — pick
// the brand, pick the model, type the one field that actually differs.
function uniqSorted(values){
  return [...new Set(values.filter(v => v && v !== '-'))].sort((a,b)=> a.localeCompare(b, undefined, {numeric:true}));
}

function fillDatalist(el, values){
  el.innerHTML = values.slice(0, 400).map(v=>`<option value="${escapeHtml(v)}">`).join('');
}

function refreshSuggestions(brandVal, modelVal){
  const b = (brandVal || '').trim().toLowerCase();
  const m = (modelVal || '').trim().toLowerCase();

  fillDatalist($('brandList'), uniqSorted(EFFECTIVE_LIBRARY.map(i=>i.b)));
  // whatever's already been used, so spellings stay consistent across a count
  fillDatalist($('loadList'), uniqSorted(EFFECTIVE_LIBRARY.map(i=>i.l).concat(sessionLog.map(e=>e.loadSpeed))));
  fillDatalist($('plyList'), uniqSorted(EFFECTIVE_LIBRARY.map(i=>i.p).concat(sessionLog.map(e=>e.ply))));

  const byBrand = b ? EFFECTIVE_LIBRARY.filter(i => i.b.toLowerCase() === b) : EFFECTIVE_LIBRARY;
  const modelPool = byBrand.length ? byBrand : EFFECTIVE_LIBRARY;
  fillDatalist($('modelList'), uniqSorted(modelPool.map(i=>i.m)));

  const byModel = m ? modelPool.filter(i => i.m.toLowerCase() === m) : modelPool;
  const sizePool = byModel.length ? byModel : modelPool;
  fillDatalist($('sizeList'), uniqSorted(sizePool.map(i=>i.s)));
}

// live count of what's already on file for this brand+model, so a duplicate is obvious
function updateSimilarHint(){
  const b = $('lBrand').value.trim().toLowerCase();
  const m = $('lModel').value.trim().toLowerCase();
  const s = $('lSize').value.trim().toLowerCase();
  const hint = $('lSimilarHint');
  if(!b){ hint.textContent = ''; return; }

  const fam = EFFECTIVE_LIBRARY.filter(i => i.b.toLowerCase()===b && (!m || i.m.toLowerCase()===m));
  const dupe = s && fam.some(i => i.s.toLowerCase()===s);
  if(dupe){
    hint.textContent = 'Already in the library — saving will add a second copy.';
    hint.className = 'hint-line warn';
  } else if(fam.length){
    hint.textContent = fam.length + ' existing size' + (fam.length===1?'':'s') + ': ' +
      fam.slice(0,6).map(i=>i.s).join(', ') + (fam.length>6 ? '…' : '');
    hint.className = 'hint-line';
  } else {
    hint.textContent = 'New to the library.';
    hint.className = 'hint-line';
  }
}

['lBrand','lModel','lSize'].forEach(id=>{

$('lSave').addEventListener('click', ()=>{
  const b = $('lBrand').value.trim();
  const s = $('lSize').value.trim();
  if(!b || !s){ showToast('Brand and size are required'); return; }
  const patch = {
    b, m: $('lModel').value.trim() || '-', s,
    c: $('lCategory').value.trim() || 'Uncategorized',
    n: $('lNotes').value.trim() || '-',
    l: $('lLoad').value.trim(),
    p: $('lPly').value.trim(),
    t: $('lType').value.trim()
  };
  if(libEditTarget && libEditTarget._custom){
    const a = libOverrides.additions.find(x=>x._id === libEditTarget._id);
    if(a) Object.assign(a, patch);
  } else if(libEditTarget){
    libOverrides.edits[libEditTarget._base] = patch;
  } else {
    libOverrides.additions.push({ _id: libAddSeq++, ...patch });
  }
  saveLibOverrides();
  buildEffectiveLibrary();
  libModalBackdrop.classList.remove('show');
  libRunSearch();
  runSearch();

  if(libSimilarMode){
    // saved from the Count tab mid-count — log it straight away rather than
    // making someone search for the thing they just typed in
    libSimilarMode = false;
    addToLog({ brand: patch.b, model: patch.m === '-' ? '' : patch.m, size: patch.s,
               cat: patch.c, notes: patch.n === '-' ? '' : patch.n,
               loadSpeed: patch.l, ply: patch.p, type: patch.t });
    showToast('Saved to library and logged');
  } else {
    showToast('Library updated');
  }
});

$('lDelete').addEventListener('click', ()=>{
  if(!libEditTarget) return;
  if(!confirm('Remove this item from the library? This won\'t affect anything already in your session log.')) return;
  if(libEditTarget._custom){
    libOverrides.additions = libOverrides.additions.filter(a => a._id !== libEditTarget._id);
  } else {
    libOverrides.deletes.push(libEditTarget._base);
    delete libOverrides.edits[libEditTarget._base];
  }
  saveLibOverrides();
  buildEffectiveLibrary();
  libModalBackdrop.classList.remove('show');
  libRunSearch();
  runSearch();
  showToast('Removed from library');
});

// ---------- session log ----------
function addToLog(entry, opts){
  // DOT is typically unique per tire, so don't fold new adds into an existing row —
  // only bump qty for exact repeat taps where DOT is still blank on both. opts.forceNew
  // skips the roll-up entirely, which is how "+DOT" gives every tire its own line.
  const cont = entry.container != null ? entry.container : containerInput.value.trim();
  // the same tire out of two different containers stays two lines
  const existing = (opts && opts.forceNew) ? null : sessionLog.find(e =>
    e.brand===entry.brand && e.model===entry.model && e.size===entry.size &&
    e.notes===entry.notes && (e.container||'')===cont && !e.dot && !entry.dot);
  let id;
  if(existing){
    existing.qty += 1;
    id = existing.id;
  } else {
    id = logIdSeq++;
    sessionLog.unshift({ id, qty: 1, ...entry, dot: entry.dot || '', comment: entry.comment || '',
      container: cont, loadSpeed: entry.loadSpeed || '', ply: entry.ply || '', type: entry.type || '' });
  }
  renderLog();
  showToast((existing ? existing.qty+'×  ' : '+1  ') + entry.brand + ' ' + entry.size);
  return id;
}

// Add another row for the same tire — different DOT, its own piece count. Batches of
// one DOT are the unit that actually gets counted, so a row means "this many, this DOT",
// not one row per tire.
function duplicateEntry(id){
  const idx = sessionLog.findIndex(x=>x.id===id);
  if(idx < 0) return;
  const e = sessionLog[idx];
  // sits directly under its sibling so the same tire stays together in the list
  const copy = { ...e, id: logIdSeq++, qty: 1, dot: '', comment: '' };
  sessionLog.splice(idx + 1, 0, copy);
  renderLog();
  showToast('Same tire — enter the DOT and count');
  focusDot(copy.id);
}

function changeQty(id, delta){
  const e = sessionLog.find(x=>x.id===id);
  if(!e) return;
  e.qty += delta;
  if(e.qty <= 0){
    sessionLog = sessionLog.filter(x=>x.id!==id);
  }
  renderLog();
}

function removeEntry(id){
  sessionLog = sessionLog.filter(x=>x.id!==id);
  renderLog();
}

function renderLog(){
  saveState();
  const total = sessionLog.reduce((a,e)=>a+e.qty,0);
  tabBadge.textContent = total;
  logTotalQty.textContent = total;
  logLineCount.textContent = sessionLog.length;

  if(sessionLog.length === 0){
    logEntries.innerHTML = '<div class="log-empty"><span class="big">—</span>Nothing logged yet this session.<br>Switch to Count and tap a result to add it.</div>';
    return;
  }

  logEntries.innerHTML = sessionLog.map(e => `
    <div class="log-entry${e.comment ? ' show-comment' : ''}">
      <div class="info">
        <div class="title">${e.brand}${e.model ? ' '+e.model : ''}</div>
        <div class="sub">${e.size}${[e.loadSpeed, e.ply, e.type, e.notes].filter(Boolean).map(x=>' · '+x).join('')}</div>
      </div>
      <div class="log-controls">
        <div class="qty-ctrl">
          <button data-act="dec" data-id="${e.id}">−</button>
          <input class="qty" type="text" inputmode="numeric" pattern="[0-9]*" value="${e.qty}" data-id="${e.id}" data-role="qty" aria-label="Pieces">
          <button data-act="inc" data-id="${e.id}">+</button>
        </div>
        <button class="add-row-btn" data-act="dup" data-id="${e.id}" title="Another row for this tire with a different DOT">+</button>
        <button class="note-btn${e.comment ? ' has-note' : ''}" data-act="note" data-id="${e.id}" aria-label="Add a comment">✎</button>
        <button class="del-btn" data-act="del" data-id="${e.id}">🗑</button>
      </div>
      <div class="log-fields">
        <input type="text" placeholder="Cont #" value="${escapeHtml(e.container || '')}" data-id="${e.id}" data-role="container" maxlength="14" class="${e.container ? 'filled' : ''}">
        <input type="text" placeholder="DOT" value="${escapeHtml(e.dot || '')}" data-id="${e.id}" data-role="dot" maxlength="20" class="${e.dot ? 'filled' : ''}">
        <input type="text" placeholder="Load/Sp" value="${escapeHtml(e.loadSpeed || '')}" data-id="${e.id}" data-role="loadSpeed" maxlength="16" class="${e.loadSpeed ? 'filled' : ''}">
        <input type="text" placeholder="Ply" value="${escapeHtml(e.ply || '')}" data-id="${e.id}" data-role="ply" maxlength="10" class="${e.ply ? 'filled' : ''}">
        <input type="text" placeholder="Type" value="${escapeHtml(e.type || '')}" data-id="${e.id}" data-role="type" maxlength="14" list="typeList" class="${e.type ? 'filled' : ''}">
      </div>
      <div class="comment-wrap">
        <textarea data-id="${e.id}" data-role="comment" rows="2" placeholder="Damage, mismatch, DOT unreadable, wrong size on sidewall…">${escapeHtml(e.comment || '')}</textarea>
      </div>
    </div>
  `).join('');
}

logEntries.addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-act]');
  if(!btn) return;
  const id = parseInt(btn.dataset.id,10);
  if(btn.dataset.act==='inc') changeQty(id, 1);
  if(btn.dataset.act==='dec') changeQty(id, -1);
  if(btn.dataset.act==='del') removeEntry(id);
  if(btn.dataset.act==='dup') duplicateEntry(id);
  if(btn.dataset.act==='note'){
    // Toggle in place rather than re-rendering — a full redraw would steal focus
    // from whatever else is open and scroll the list out from under a gloved thumb.
    const row = btn.closest('.log-entry');
    row.classList.toggle('show-comment');
    if(row.classList.contains('show-comment')){
      const ta = row.querySelector('textarea[data-role="comment"]');
      if(ta) ta.focus();
    }
  }
});

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

let dotSaveTimer;
logEntries.addEventListener('input', (e)=>{

  const field = e.target.closest('.log-fields input[data-role]');
  if(field){
    const id = parseInt(field.dataset.id,10);
    const entry = sessionLog.find(x=>x.id===id);
    if(entry) entry[field.dataset.role] = field.value;
    field.classList.toggle('filled', !!field.value.trim());
    clearTimeout(dotSaveTimer);
    dotSaveTimer = setTimeout(saveState, 400);
    return;
  }

  const qty = e.target.closest('input[data-role="qty"]');
  if(qty){
    // update totals in place — a full redraw here would yank the keyboard away mid-number
    const id = parseInt(qty.dataset.id,10);
    const entry = sessionLog.find(x=>x.id===id);
    const val = parseInt(qty.value.replace(/[^0-9]/g,''), 10);
    if(entry && Number.isFinite(val) && val > 0){
      entry.qty = val;
      const total = sessionLog.reduce((a,x)=>a+x.qty,0);
      tabBadge.textContent = total;
      logTotalQty.textContent = total;
      clearTimeout(dotSaveTimer);
      dotSaveTimer = setTimeout(saveState, 400);
    }
    return;
  }

  const ta = e.target.closest('textarea[data-role="comment"]');
  if(ta){
    const id = parseInt(ta.dataset.id,10);
    const entry = sessionLog.find(x=>x.id===id);
    if(entry) entry.comment = ta.value;
    // keep the amber marker in sync without redrawing the row
    const row = ta.closest('.log-entry');
    const mark = row && row.querySelector('.note-btn');
    if(mark) mark.classList.toggle('has-note', !!ta.value.trim());
    clearTimeout(dotSaveTimer);
    dotSaveTimer = setTimeout(saveState, 400);
  }
});

logEntries.addEventListener('focusout', (e)=>{
  const qty = e.target.closest('input[data-role="qty"]');
  if(!qty) return;
  const id = parseInt(qty.dataset.id,10);
  const entry = sessionLog.find(x=>x.id===id);
  const val = parseInt(qty.value.replace(/[^0-9]/g,''), 10);
  if(entry && (!Number.isFinite(val) || val < 1)){
    qty.value = entry.qty;   // restore rather than silently dropping the line
  }
  renderLog();
});

$('clearLogBtn').addEventListener('click', ()=>{
  if(sessionLog.length && !confirm('Clear the entire session log? This can\'t be undone.')) return;
  sessionLog = [];
  renderLog();
});

function logoBytes(){
  const bin = atob(LOGO_B64);
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
// An .xlsx is a zip of XML parts. There's no library to load here — the app has to keep
// working in a container with no signal — so this writes both the zip and the sheet by
// hand. Store-only (no deflate) keeps it to about 60 lines; a count sheet is small enough
// that compression buys nothing worth the code.

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for(let i=0;i<256;i++){
    let c = i;
    for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function zipStore(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;

  const u16 = n => [n & 0xFF, (n >>> 8) & 0xFF];
  const u32 = n => [n & 0xFF, (n >>> 8) & 0xFF, (n >>> 16) & 0xFF, (n >>> 24) & 0xFF];

  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = (f.data instanceof Uint8Array) ? f.data : enc.encode(f.data);
    const crc = crc32(data);
    // fixed DOS timestamp — Excel doesn't care and it keeps output deterministic
    const time = 0, date = 0x2100;

    const local = [
      ...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0),
      ...u16(time), ...u16(date), ...u32(crc),
      ...u32(data.length), ...u32(data.length),
      ...u16(name.length), ...u16(0)
    ];
    parts.push(new Uint8Array(local), name, data);

    central.push([
      ...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0),
      ...u16(time), ...u16(date), ...u32(crc),
      ...u32(data.length), ...u32(data.length),
      ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(0), ...u32(offset)
    ]);
    central.push(name);
    offset += local.length + name.length + data.length;
  });

  const cdParts = [];
  let cdLen = 0;
  for(let i=0;i<central.length;i+=2){
    const head = new Uint8Array(central[i]);
    cdParts.push(head, central[i+1]);
    cdLen += head.length + central[i+1].length;
  }
  const end = new Uint8Array([
    ...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(files.length), ...u16(files.length),
    ...u32(cdLen), ...u32(offset), ...u16(0)
  ]);

  const all = [...parts, ...cdParts, end];
  const total = all.reduce((a,p)=>a+p.length,0);
  const out = new Uint8Array(total);
  let p = 0;
  all.forEach(chunk => { out.set(chunk, p); p += chunk.length; });
  return out;
}

function xmlEsc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]
  ));
}

function colName(n){
  let s = '';
  while(n > 0){ const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

// cell: {v, s, num} — num renders as a number, everything else as inline text
function cellXml(col, row, cell){
  const ref = colName(col) + row;
  const style = cell.s ? ` s="${cell.s}"` : '';
  if(cell.v === '' || cell.v == null) return `<c r="${ref}"${style}/>`;
  if(cell.num) return `<c r="${ref}"${style}><v>${cell.v}</v></c>`;
  return `<c r="${ref}"${style} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(cell.v)}</t></is></c>`;
}

<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/image1.png"/>
</Relationships>` },
    { name: 'xl/worksheets/_rels/sheet1.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

</Relationships>` },
    { name: 'xl/media/image1.png', data: logoBytes() },
    { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>

function downloadBlob(blob, fname){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportRows(){
  const container = $('containerInput').value.trim();
  const date = $('dateInput').value;
  const counter = $('counterInput').value.trim();
  return sessionLog.slice().reverse().map(e => [
    e.container || container, date, counter, e.brand, e.model === '-' ? '' : e.model,
    e.size, e.loadSpeed || '', e.ply || '', e.type || '',
    e.dot || '', e.cat, e.notes || '', e.comment || '', e.qty
  ]);
}

const EXPORT_HEADER = ['Container','Date','Counted By','Brand','Model','Size','Load / Speed','Ply / LR','Type','DOT','Category','Spec','Comments','Qty'];
const EXPORT_WIDTHS = [15, 12, 15, 18, 22, 18, 13, 10, 12, 14, 17, 14, 40, 7];

$('exportBtn').addEventListener('click', ()=>{
  if(sessionLog.length === 0){ showToast('Log is empty'); return; }
  const container = $('containerInput').value.trim();
  const date = $('dateInput').value;
  const counter = $('counterInput').value.trim();
  const data = exportRows();
  const totalQty = sessionLog.reduce((a,e)=>a+e.qty,0);
  const lastCol = colName(EXPORT_HEADER.length);

  // Rows 1-3 are the letterhead: the logo drawing sits over the left, these cells carry
  // the right-hand block. Row 4 is the amber rule under both.
  const lastIdx = EXPORT_HEADER.length - 1;
  const rightBlock = (text, style) => {
    const cells = EXPORT_HEADER.map(()=> ({v:'', s:0}));
    cells[lastIdx] = {v:text, s:style};
    return cells;
  };

  const rows = [];
  rows.push({ h: 21, cells: rightBlock('Container tire count', 8) });
  rows.push({ h: 15, cells: rightBlock('Prepared for LSL Distributors', 9) });
  rows.push({ h: 15, cells: rightBlock(
    (container || 'Container —') + '  ·  ' + date + (counter ? '  ·  ' + counter : ''), 9) });
  rows.push({ h: 10, cells: EXPORT_HEADER.map(()=> ({v:'', s:10})) });
  rows.push({ cells: [
    {v:'Total tires', s:2}, {v:totalQty, s:3, num:true}, {v:'Line items', s:2},
    {v:sessionLog.length, s:3, num:true}, {v:'Exported', s:2},
    {v:new Date().toLocaleString(), s:3}
  ]});
  rows.push({ cells: [] });
  rows.push({ h: 30, cells: EXPORT_HEADER.map(h => ({v:h, s:4})) });

  const headerRow = rows.length;
  data.forEach(r => {
    // give a row extra height when the comment will wrap, so nothing hides behind a cell edge
    const comment = String(r[12] || '');
    const lines = Math.min(4, Math.ceil(comment.length / 40) || 1);
    rows.push({
      h: lines > 1 ? 15 * lines : 0,
      cells: r.map((v, i) => i === 13 ? {v, s:6, num:true} : {v, s:5})
    });
  });
  const lastDataRow = rows.length;

  const totalCells = EXPORT_HEADER.map(()=> ({v:'', s:7}));
  totalCells[0] = {v:'TOTAL', s:7};
  totalCells[EXPORT_HEADER.length-2] = {v:sessionLog.length + ' line items', s:7};
  totalCells[EXPORT_HEADER.length-1] = {v:totalQty, s:7, num:true};
  rows.push({ h: 22, cells: totalCells });

  const bytes = buildXlsx(rows, EXPORT_WIDTHS, {
    headerRow, lastDataRow, merges: []
  });

  const fname = 'LSL_Count_' + (container || 'session') + '_' + date + '.xlsx';
  downloadBlob(new Blob([bytes], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), fname);
  showToast('Exported ' + fname);
});

function csvEscape(v){
  v = String(v ?? '');
  if(/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}

$('exportCsvBtn').addEventListener('click', ()=>{
  if(sessionLog.length === 0){ showToast('Log is empty'); return; }
  const container = $('containerInput').value.trim();
  const date = $('dateInput').value;
  const rows = [EXPORT_HEADER, ...exportRows()];
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  // BOM so Excel opens accented brand names correctly instead of mojibake
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  downloadBlob(blob, 'LSL_Count_' + (container || 'session') + '_' + date + '.csv');
  showToast('CSV exported');
});

// ---------- full backup / restore (session log + library overrides, as one portable file) ----------
$('backupBtn').addEventListener('click', ()=>{
  const payload = {
    type: 'lsl_container_count_backup', version: 1, exportedAt: new Date().toISOString(),
    session: {
      sessionLog, logIdSeq,
      container: containerInput.value, date: dateInput.value, counter: counterInput.value
    },
    libOverrides: { ...libOverrides, libAddSeq }
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fname = 'LSL_Backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Backup saved — ' + fname);
});

const restoreFileInput = $('restoreFile');
$('restoreBtn').addEventListener('click', ()=> restoreFileInput.click());
restoreFileInput.addEventListener('change', ()=>{
  const file = restoreFileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(err){ showToast('That file isn\'t a valid backup'); restoreFileInput.value=''; return; }
    if(!data || data.type !== 'lsl_container_count_backup' || !data.session){
      showToast('That file isn\'t a valid backup');
      restoreFileInput.value=''; return;
    }
    const currentTotal = sessionLog.reduce((a,e)=>a+e.qty,0);
    const incomingTotal = (data.session.sessionLog||[]).reduce((a,e)=>a+e.qty,0);
    const msg = currentTotal > 0
      ? `Replace your current session (${currentTotal} tires) with this backup (${incomingTotal} tires, saved ${new Date(data.exportedAt).toLocaleString()})? This can't be undone.`
      : `Restore backup from ${new Date(data.exportedAt).toLocaleString()} — ${incomingTotal} tires?`;
    if(!confirm(msg)){ restoreFileInput.value=''; return; }

    sessionLog = data.session.sessionLog || [];
    logIdSeq = data.session.logIdSeq || 1;
    if(data.session.container !== undefined) containerInput.value = data.session.container;
    if(data.session.date) dateInput.value = data.session.date;
    if(data.session.counter !== undefined) counterInput.value = data.session.counter;

    if(data.libOverrides){
      libOverrides = { edits: data.libOverrides.edits||{}, deletes: data.libOverrides.deletes||[], additions: data.libOverrides.additions||[] };
      libAddSeq = data.libOverrides.libAddSeq || 1;
    }

    saveState();
    saveLibOverrides();
    buildEffectiveLibrary();
    renderLog();
    runSearch();
    libRunSearch();
    restoreFileInput.value = '';
    showToast('Restored ' + incomingTotal + ' tires from backup');
  };
  reader.readAsText(file);
});
const modalBackdrop = $('customModalBackdrop');
$('customAddBtn').addEventListener('click', ()=>{
  $('cBrand').value = searchInput.value.trim();
  $('cModel').value=''; $('cSize').value=''; $('cDot').value=''; $('cNotes').value='';
  $('cLoad').value=''; $('cPly').value=''; $('cType').value='';
  modalBackdrop.classList.add('show');
  setTimeout(()=>$('cBrand').focus(), 50);
});
$('cCancel').addEventListener('click', ()=> modalBackdrop.classList.remove('show'));
modalBackdrop.addEventListener('click', (e)=>{ if(e.target===modalBackdrop) modalBackdrop.classList.remove('show'); });
$('cAdd').addEventListener('click', ()=>{
  const brand = $('cBrand').value.trim();
  const size = $('cSize').value.trim();
  if(!brand || !size){ showToast('Brand and size are required'); return; }
  addToLog({ brand, model: $('cModel').value.trim(), size, cat: 'Manual',
    notes: $('cNotes').value.trim(), dot: $('cDot').value.trim(),
    loadSpeed: $('cLoad').value.trim(), ply: $('cPly').value.trim(), type: $('cType').value.trim() });
  modalBackdrop.classList.remove('show');
});

// ---------- toast ----------
let toastTimer;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toast.classList.remove('show'), 1400);
}

// ---------- keep sticky search/log headers pinned exactly below the real header height ----------
// (varies by device — notch/dynamic-island safe-area insets differ, so a fixed px guess breaks on some phones)
const headerEl = document.querySelector('header');
function syncHeaderHeight(){
  document.documentElement.style.setProperty('--header-h', headerEl.offsetHeight + 'px');
}
syncHeaderHeight();
window.addEventListener('resize', syncHeaderHeight);
window.addEventListener('orientationchange', syncHeaderHeight);
setTimeout(syncHeaderHeight, 300); // catch late font-swap reflow

renderLog();

// ---------- offline status ----------
// The whole app (library included) is baked into this file, so losing signal inside a
// container changes nothing. The tick just says so out loud, because a blank status
// bar on a phone with no bars is the moment you start doubting the tool.
const netTick = $('netTick');
function syncNetTick(){
  if(navigator.onLine){
    netTick.textContent = EFFECTIVE_LIBRARY.length.toLocaleString() + ' items';
    netTick.style.color = 'var(--ink-dim)';
  } else {
    netTick.textContent = 'OFFLINE · ready';
    netTick.style.color = 'var(--amber)';
  }
  syncHeaderHeight();
}
window.addEventListener('online', syncNetTick);
window.addEventListener('offline', syncNetTick);
syncNetTick();

// ---------- service worker ----------
// Registered with relative paths so the app works from a GitHub Pages project
// subpath (username.github.io/repo/) without any config changes.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').then(reg => {
      // A waiting worker means a new index.html is already downloaded and sitting
      // ready — surface it instead of silently swapping mid-count.
      if(reg.waiting && navigator.serviceWorker.controller) showUpdateBar(reg.waiting);
      reg.addEventListener('updatefound', ()=>{
        const sw = reg.installing;
        if(!sw) return;
        sw.addEventListener('statechange', ()=>{
          if(sw.state === 'installed' && navigator.serviceWorker.controller){
            showUpdateBar(sw);
          }
        });
      });
    }).catch(()=>{ /* SW unavailable (file:// or private mode) — app still runs */ });

    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(reloading) return;
      reloading = true;
      window.location.reload();
    });
  });
}

const updateBar = $('updateBar');
function showUpdateBar(worker){
  const pending = sessionLog.reduce((a,e)=>a+e.qty,0);
  $('updateMsg').textContent = pending
    ? 'New version ready. Your ' + pending + ' logged tires are kept.'
    : 'A newer version is ready.';
  updateBar.classList.add('show');
  syncHeaderHeight();
  $('updateNow').onclick = ()=>{
    saveState();               // flush the log before the reload
    worker.postMessage({type:'SKIP_WAITING'});
    updateBar.classList.remove('show');
  };
  $('updateLater').onclick = ()=>{
    updateBar.classList.remove('show');
    syncHeaderHeight();
  };
}
</script>
